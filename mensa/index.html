<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOGA - Menu Mensa</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f3ed;
  color:#181818;
  font-family:Arial,Helvetica,sans-serif;
}
main{
  max-width:760px;
  margin:auto;
  padding:32px 18px 60px;
}
header{text-align:center;margin-bottom:28px}
h1{
  font-size:42px;
  letter-spacing:5px;
  margin:10px 0;
}
.subtitle{font-size:23px;color:#666}
#today{font-size:21px;font-weight:bold;margin-top:20px}

.languages{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:24px 0;
}
.languages button{
  border:1px solid #ccc;
  background:white;
  border-radius:20px;
  padding:9px 17px;
  font-weight:bold;
  font-size:15px;
}
.languages button.active{
  background:#285d4b;
  color:white;
  border-color:#285d4b;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:25px;
  padding:24px 26px;
  margin:18px 0;
}
.label{
  color:#285d4b;
  font-size:18px;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:15px;
}
.dish{
  font-size:21px;
  font-weight:bold;
  margin:10px 0 4px;
}
.notes{
  color:#666;
  font-size:16px;
  margin-bottom:12px;
}
footer{
  color:#666;
  font-size:16px;
  text-align:center;
  margin-top:35px;
  line-height:1.5;
}
</style>
</head>

<body>
<main>

<header>
<h1>DOGA</h1>
<div class="subtitle" id="subtitle">Menù Mensa</div>
<div id="today"></div>

<div class="languages">
<button id="b-it" onclick="setLang('it')">IT</button>
<button id="b-en" onclick="setLang('en')">EN</button>
<button id="b-es" onclick="setLang('es')">ES</button>
</div>
</header>

<div id="menu"></div>

<footer id="footer"></footer>

</main>

<script>
const menus = {

it:{
 subtitle:"Menù Mensa",
 sections:[
  ["PRIMI",[
   ["Tortellini di branzino con burro e limone","Allergeni: glutine, uova, pesce, latte"],
   ["Pasta con crema di zucchine e ricotta salata","Allergeni: glutine, latte"]
  ]],
  ["SECONDI / ALTERNATIVE",[
   ["Pollo alla cacciatora","Allergeni: chiedere al personale secondo preparazione"],
   ["Hamburger di manzo","Allergeni: chiedere al personale secondo preparazione"],
   ["Caprese","Allergeni: latte"],
   ["Prosciutto e mozzarella","Allergeni: latte"]
  ]],
  ["INSALATE",[
   ["Caesar","Allergeni: glutine, latte, uova; chiedere al personale per la salsa"],
   ["Insalatona","Allergeni: chiedere al personale in base agli ingredienti"]
  ]],
  ["CONTORNI",[
   ["Patate fritte","Allergeni: chiedere al personale per eventuali contaminazioni in frittura"],
   ["Patate al forno","Allergeni: chiedere al personale"],
   ["Verdure miste","Allergeni: chiedere al personale"]
  ]]
 ],
 footer:"Il menù può variare in base alla disponibilità dei prodotti. Per allergie o intolleranze rivolgersi al personale."
},

en:{
 subtitle:"Canteen Menu",
 sections:[
  ["PASTA",[
   ["Sea bass tortellini with butter and lemon","Allergens: gluten, eggs, fish, milk"],
   ["Pasta with courgette cream and salted ricotta","Allergens: gluten, milk"]
  ]],
  ["MAIN COURSES / ALTERNATIVES",[
   ["Chicken cacciatore","Allergens: please ask our staff, depending on preparation"],
   ["Beef hamburger","Allergens: please ask our staff, depending on preparation"],
   ["Caprese salad","Allergens: milk"],
   ["Ham and mozzarella","Allergens: milk"]
  ]],
  ["SALADS",[
   ["Caesar salad","Allergens: gluten, milk, eggs; please ask our staff about the dressing"],
   ["Large mixed salad","Allergens: please ask our staff depending on ingredients"]
  ]],
  ["SIDE DISHES",[
   ["French fries","Allergens: please ask our staff about possible cross-contact during frying"],
   ["Roast potatoes","Allergens: please ask our staff"],
   ["Mixed vegetables","Allergens: please ask our staff"]
  ]]
 ],
 footer:"The menu may vary depending on product availability. Please inform our staff of any food allergies or intolerances."
},

es:{
 subtitle:"Menú de Comedor",
 sections:[
  ["PRIMEROS",[
   ["Tortellini de lubina con mantequilla y limón","Alérgenos: gluten, huevos, pescado, leche"],
   ["Pasta con crema de calabacín y ricotta salada","Alérgenos: gluten, leche"]
  ]],
  ["SEGUNDOS / ALTERNATIVAS",[
   ["Pollo a la cazadora","Alérgenos: consultar al personal según la preparación"],
   ["Hamburguesa de ternera","Alérgenos: consultar al personal según la preparación"],
   ["Ensalada Caprese","Alérgenos: leche"],
   ["Jamón y mozzarella","Alérgenos: leche"]
  ]],
  ["ENSALADAS",[
   ["Ensalada César","Alérgenos: gluten, leche, huevos; consultar al personal sobre la salsa"],
   ["Ensalada mixta grande","Alérgenos: consultar al personal según los ingredientes"]
  ]],
  ["GUARNICIONES",[
   ["Patatas fritas","Alérgenos: consultar al personal sobre posibles contaminaciones durante la fritura"],
   ["Patatas al horno","Alérgenos: consultar al personal"],
   ["Verduras mixtas","Alérgenos: consultar al personal"]
  ]]
 ],
 footer:"El menú puede variar según la disponibilidad de los productos. Para alergias o intolerancias, consulte al personal."
}

};

function setLang(lang){
 const x=menus[lang];

 document.getElementById("subtitle").textContent=x.subtitle;
 document.documentElement.lang=lang;

 document.querySelectorAll(".languages button")
   .forEach(b=>b.classList.remove("active"));
 document.getElementById("b-"+lang).classList.add("active");

 const d=new Date();
 const isSunday=d.getDay()===0;
 let html="";

 if(isSunday){
   const sunday={
     it:{
       label:"DOMENICA",
       title:"Servizio mensa non effettuato",
       text:"Su richiesta, possono essere disponibili alcune proposte in base alla disponibilità della cucina.",
       footer:"Per informazioni rivolgersi al personale."
     },
     en:{
       label:"SUNDAY",
       title:"Canteen service not available",
       text:"Some dishes may be available on request, subject to kitchen availability.",
       footer:"Please ask our staff for more information."
     },
     es:{
       label:"DOMINGO",
       title:"Servicio de comedor no disponible",
       text:"Algunos platos pueden estar disponibles bajo petición, según la disponibilidad de la cocina.",
       footer:"Para más información, consulte al personal."
     }
   }[lang];

   html='<section class="card">'
       +'<div class="label">'+sunday.label+'</div>'
       +'<div class="dish">'+sunday.title+'</div>'
       +'<div class="notes">'+sunday.text+'</div>'
       +'</section>';

   document.getElementById("footer").textContent=sunday.footer;

 }else{

   x.sections.forEach(section=>{
     html+='<section class="card">';
     html+='<div class="label">'+section[0]+'</div>';

     section[1].forEach(item=>{
       html+='<div class="dish">'+item[0]+'</div>';
       html+='<div class="notes">'+item[1]+'</div>';
     });

     html+='</section>';
   });

   document.getElementById("footer").textContent=x.footer;
 }

 document.getElementById("menu").innerHTML=html;

 const locale=lang==="it"?"it-IT":lang==="es"?"es-ES":"en-GB";
 document.getElementById("today").textContent=
   d.toLocaleDateString(locale,{
     weekday:"long",
     day:"numeric",
     month:"long",
     year:"numeric"
   });
}

setLang("it");
</script>

</body>
</html>
