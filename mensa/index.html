<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOGA - Menu Mensa</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f3ed;
  color:#181818;
  font-family:Arial,Helvetica,sans-serif;
}
main{
  max-width:760px;
  margin:auto;
  padding:32px 18px 60px;
}
header{text-align:center;margin-bottom:28px}
h1{
  font-size:42px;
  letter-spacing:5px;
  margin:10px 0;
}
.subtitle{font-size:23px;color:#666}
#today{font-size:21px;font-weight:bold;margin-top:20px}

.languages{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:24px 0;
}
.languages button{
  border:1px solid #ccc;
  background:white;
  border-radius:20px;
  padding:9px 17px;
  font-weight:bold;
  font-size:15px;
}
.languages button.active{
  background:#285d4b;
  color:white;
  border-color:#285d4b;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:25px;
  padding:24px 26px;
  margin:18px 0;
}
.label{
  color:#285d4b;
  font-size:18px;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:15px;
}
.dish{
  font-size:21px;
  font-weight:bold;
  margin:10px 0 4px;
}
.notes{
  color:#666;
  font-size:16px;
  margin-bottom:12px;
}
footer{
  color:#666;
  font-size:16px;
  text-align:center;
  margin-top:35px;
  line-height:1.5;
}
</style>
</head>

<body>
<main>

<header>
<h1>DOGA</h1>
<div class="subtitle" id="subtitle">Menù Mensa</div>
<div id="today"></div>

<div class="languages">
<button id="b-it" onclick="setLang('it')">IT</button>
<button id="b-en" onclick="setLang('en')">EN</button>
<button id="b-es" onclick="setLang('es')">ES</button>
</div>
</header>

<div id="menu"></div>

<footer id="footer"></footer>

</main>

<script>
const menus = {

it:{
 subtitle:"Menù Mensa Self-Service",
 sections:[
  ["SERVIZIO MENSA",[
   ["Proposte del giorno","Il servizio mensa propone ogni giorno una selezione di piatti in base alla disponibilità della cucina e dei prodotti."]
  ]],
  ["SEMPRE A DISPOSIZIONE",[
   ["Due primi","Due proposte di primo piatto, secondo la disponibilità del giorno."],
   ["Due secondi","Due proposte di secondo piatto, secondo la disponibilità del giorno."],
   ["Le nostre insalate","Le nostre proposte di insalate."],
   ["I nostri contorni","Una selezione dei nostri contorni disponibili."]
  ]]
 ],
 footer:"Le proposte possono variare durante la giornata. Per conoscere i piatti disponibili e i relativi allergeni, rivolgersi al personale."
},

en:{
 subtitle:"Self-Service Canteen Menu",
 sections:[
  ["CANTEEN SERVICE",[
   ["Today's selection","Every day, the canteen offers a selection of dishes according to kitchen and product availability."]
  ]],
  ["AVAILABLE OPTIONS",[
   ["Two first courses","Two first-course options, subject to daily availability."],
   ["Two main courses","Two main-course options, subject to daily availability."],
   ["Our salads","Our selection of salads."],
   ["Our side dishes","A selection of our available side dishes."]
  ]]
 ],
 footer:"Dishes may change during the day. Please ask our staff about today's available dishes and their allergens."
},

es:{
 subtitle:"Menú de Comedor Self-Service",
 sections:[
  ["SERVICIO DE COMEDOR",[
   ["Propuestas del día","Cada día, el servicio de comedor ofrece una selección de platos según la disponibilidad de la cocina y de los productos."]
  ]],
  ["OPCIONES DISPONIBLES",[
   ["Dos primeros","Dos propuestas de primer plato, según la disponibilidad del día."],
   ["Dos segundos","Dos propuestas de segundo plato, según la disponibilidad del día."],
   ["Nuestras ensaladas","Nuestra selección de ensaladas."],
   ["Nuestras guarniciones","Una selección de nuestras guarniciones disponibles."]
  ]]
 ],
 footer:"Las propuestas pueden variar durante el día. Consulte al personal para conocer los platos disponibles y sus alérgenos."
}

};

function setLang(lang){
 const x=menus[lang];

 document.getElementById("subtitle").textContent=x.subtitle;
 document.documentElement.lang=lang;

 document.querySelectorAll(".languages button")
   .forEach(b=>b.classList.remove("active"));
 document.getElementById("b-"+lang).classList.add("active");

 const d=new Date();
 const isSunday=d.getDay()===0;
 let html="";

 if(isSunday){
   const sunday={
     it:{
       label:"DOMENICA",
       title:"Servizio mensa non effettuato",
       text:"Su richiesta, possono essere disponibili alcune proposte in base alla disponibilità della cucina.",
       footer:"Per informazioni rivolgersi al personale."
     },
     en:{
       label:"SUNDAY",
       title:"Canteen service not available",
       text:"Some dishes may be available on request, subject to kitchen availability.",
       footer:"Please ask our staff for more information."
     },
     es:{
       label:"DOMINGO",
       title:"Servicio de comedor no disponible",
       text:"Algunos platos pueden estar disponibles bajo petición, según la disponibilidad de la cocina.",
       footer:"Para más información, consulte al personal."
     }
   }[lang];

   html='<section class="card">'
       +'<div class="label">'+sunday.label+'</div>'
       +'<div class="dish">'+sunday.title+'</div>'
       +'<div class="notes">'+sunday.text+'</div>'
       +'</section>';

   document.getElementById("footer").textContent=sunday.footer;

 }else{

   x.sections.forEach(section=>{
     html+='<section class="card">';
     html+='<div class="label">'+section[0]+'</div>';

     section[1].forEach(item=>{
       html+='<div class="dish">'+item[0]+'</div>';
       html+='<div class="notes">'+item[1]+'</div>';
     });

     html+='</section>';
   });

   document.getElementById("footer").textContent=x.footer;
 }

 document.getElementById("menu").innerHTML=html;

 const locale=lang==="it"?"it-IT":lang==="es"?"es-ES":"en-GB";
 document.getElementById("today").textContent=
   d.toLocaleDateString(locale,{
     weekday:"long",
     day:"numeric",
     month:"long",
     year:"numeric"
   });
}

setLang("it");
</script>

</body>
</html>
