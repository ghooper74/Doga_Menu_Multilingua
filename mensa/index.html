<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOGA - Menu Mensa</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f3ed;
  color:#181818;
  font-family:Arial,Helvetica,sans-serif;
}
main{
  max-width:760px;
  margin:auto;
  padding:32px 18px 60px;
}
header{text-align:center;margin-bottom:28px}
h1{
  font-size:42px;
  letter-spacing:5px;
  margin:10px 0;
}
.subtitle{font-size:23px;color:#666}
#today{font-size:21px;font-weight:bold;margin-top:20px}

.languages{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:24px 0;
}
.languages button{
  border:1px solid #ccc;
  background:white;
  border-radius:20px;
  padding:9px 17px;
  font-weight:bold;
  font-size:15px;
}
.languages button.active{
  background:#285d4b;
  color:white;
  border-color:#285d4b;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:25px;
  padding:24px 26px;
  margin:18px 0;
}
.label{
  color:#285d4b;
  font-size:18px;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:15px;
}
.dish{
  font-size:21px;
  font-weight:bold;
  margin:10px 0 4px;
}
.notes{
  color:#666;
  font-size:16px;
  margin-bottom:12px;
}
footer{
  color:#666;
  font-size:16px;
  text-align:center;
  margin-top:35px;
  line-height:1.5;
}
</style>
</head>

<body>
<main>

<header>
<h1>DOGA</h1>
<div class="subtitle" id="subtitle">Menù Mensa</div>
<div id="today"></div>

<div class="languages">
<button id="b-it" onclick="setLang('it')">IT</button>
<button id="b-en" onclick="setLang('en')">EN</button>
<button id="b-es" onclick="setLang('es')">ES</button>
</div>
</header>

<div id="menu"></div>

<footer id="footer"></footer>

</main>

<script>
const menus = {

it:{
 subtitle:"Menù Mensa",
 sections:[
  ["MENÙ DI OGGI",[
   ["Disponibilità del giorno","Le proposte della mensa variano in base alla disponibilità della cucina."]
  ]],
  ["PROPOSTE",[
   ["Pasta","È normalmente disponibile una proposta di pasta del giorno."],
   ["Secondo","È normalmente disponibile un secondo del giorno."],
   ["Insalate","Le nostre insalate sono sempre disponibili."]
  ]]
 ],
 footer:"Per conoscere i piatti disponibili oggi e i relativi allergeni, rivolgersi al personale."
},

en:{
 subtitle:"Canteen Menu",
 sections:[
  ["TODAY'S MENU",[
   ["Today's availability","Canteen dishes vary according to kitchen availability."]
  ]],
  ["AVAILABLE OPTIONS",[
   ["Pasta","A pasta dish of the day is normally available."],
   ["Main course","A main course of the day is normally available."],
   ["Salads","Our salads are always available."]
  ]]
 ],
 footer:"Please ask our staff about today's available dishes and their allergens."
},

es:{
 subtitle:"Menú de Comedor",
 sections:[
  ["MENÚ DE HOY",[
   ["Disponibilidad del día","Las propuestas del comedor varían según la disponibilidad de la cocina."]
  ]],
  ["PROPUESTAS",[
   ["Pasta","Normalmente hay disponible un plato de pasta del día."],
   ["Segundo plato","Normalmente hay disponible un segundo plato del día."],
   ["Ensaladas","Nuestras ensaladas están siempre disponibles."]
  ]]
 ],
 footer:"Consulte al personal para conocer los platos disponibles hoy y sus alérgenos."
}

};

function setLang(lang){
 const x=menus[lang];

 document.getElementById("subtitle").textContent=x.subtitle;
 document.documentElement.lang=lang;

 document.querySelectorAll(".languages button")
   .forEach(b=>b.classList.remove("active"));
 document.getElementById("b-"+lang).classList.add("active");

 const d=new Date();
 const isSunday=d.getDay()===0;
 let html="";

 if(isSunday){
   const sunday={
     it:{
       label:"DOMENICA",
       title:"Servizio mensa non effettuato",
       text:"Su richiesta, possono essere disponibili alcune proposte in base alla disponibilità della cucina.",
       footer:"Per informazioni rivolgersi al personale."
     },
     en:{
       label:"SUNDAY",
       title:"Canteen service not available",
       text:"Some dishes may be available on request, subject to kitchen availability.",
       footer:"Please ask our staff for more information."
     },
     es:{
       label:"DOMINGO",
       title:"Servicio de comedor no disponible",
       text:"Algunos platos pueden estar disponibles bajo petición, según la disponibilidad de la cocina.",
       footer:"Para más información, consulte al personal."
     }
   }[lang];

   html='<section class="card">'
       +'<div class="label">'+sunday.label+'</div>'
       +'<div class="dish">'+sunday.title+'</div>'
       +'<div class="notes">'+sunday.text+'</div>'
       +'</section>';

   document.getElementById("footer").textContent=sunday.footer;

 }else{

   x.sections.forEach(section=>{
     html+='<section class="card">';
     html+='<div class="label">'+section[0]+'</div>';

     section[1].forEach(item=>{
       html+='<div class="dish">'+item[0]+'</div>';
       html+='<div class="notes">'+item[1]+'</div>';
     });

     html+='</section>';
   });

   document.getElementById("footer").textContent=x.footer;
 }

 document.getElementById("menu").innerHTML=html;

 const locale=lang==="it"?"it-IT":lang==="es"?"es-ES":"en-GB";
 document.getElementById("today").textContent=
   d.toLocaleDateString(locale,{
     weekday:"long",
     day:"numeric",
     month:"long",
     year:"numeric"
   });
}

setLang("it");
</script>

</body>
</html>
